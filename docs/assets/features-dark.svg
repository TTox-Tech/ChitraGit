<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 538" width="1280" height="538" role="img" aria-label="Features: parallel sync, never loses your work, never loses history, a clickable ledger, rescued repos, any forge, KodeKavach security audit, hardened git runner, scheduled and offline.">
<style>
@font-face{font-family:'M PLUS Code Latin';font-weight:100 700;src:url(data:font/woff2;base64,) format('woff2')}

.bg{fill:#0A0C10} .surface{fill:#111418} .raised{fill:#1A1F26}
.rule{stroke:#2B313A} .rulef{fill:#2B313A}
.text{fill:#E6EDF3} .muted{fill:#8B949E} .accent{fill:#3B82F6} .accents{stroke:#3B82F6}
.sky{fill:#7DD3FC} .sage{fill:#72C795} .amber{fill:#E3B341} .sindoor{fill:#F47067}
.display{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace;font-weight:600} .sans{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace} .mono{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace}

</style>
<rect x="24.0" y="24" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="24.0" y="24" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="48.0" y="48" width="44" height="44" rx="11" class="raised"/><g transform="translate(58.0 58) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13M3 12h16M3 18h10"/><path d="M14 3l3 3-3 3M17 9l3 3-3 3M11 15l3 3-3 3"/></g></g><text x="108.0" y="77" class="display text" font-size="21">Parallel sync</text><text x="48.0" y="124" class="sans muted" font-size="15">5,000+ repos on a worker pool,</text><text x="48.0" y="146" class="sans muted" font-size="15">per-host limits and retries</text><rect x="441.3333333333333" y="24" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="441.3333333333333" y="24" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="465.3333333333333" y="48" width="44" height="44" rx="11" class="raised"/><g transform="translate(475.3333333333333 58) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g></g><text x="525.3333333333333" y="77" class="display text" font-size="21">Never loses your work</text><text x="465.3333333333333" y="124" class="sans muted" font-size="15">local changes are stashed and put</text><text x="465.3333333333333" y="146" class="sans muted" font-size="15">back; clashes are rolled back</text><rect x="858.6666666666666" y="24" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="858.6666666666666" y="24" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="882.6666666666666" y="48" width="44" height="44" rx="11" class="raised"/><g transform="translate(892.6666666666666 58) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 3v4.5h4.5"/><path d="M12 7.5V12l3 2"/></g></g><text x="942.6666666666666" y="77" class="display text" font-size="21">Never loses history</text><text x="882.6666666666666" y="124" class="sans muted" font-size="15">deleted branches and force-pushed</text><text x="882.6666666666666" y="146" class="sans muted" font-size="15">history are kept as refs</text><rect x="24.0" y="194" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="24.0" y="194" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="48.0" y="218" width="44" height="44" rx="11" class="raised"/><g transform="translate(58.0 228) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M2.5 8.5h19M9 8.5V20"/></g></g><text x="108.0" y="247" class="display text" font-size="21">A ledger you can click</text><text x="48.0" y="294" class="sans muted" font-size="15">repo browser, README, commits,</text><text x="48.0" y="316" class="sans muted" font-size="15">conflicts, health, settings</text><rect x="441.3333333333333" y="194" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="441.3333333333333" y="194" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="465.3333333333333" y="218" width="44" height="44" rx="11" class="raised"/><g transform="translate(475.3333333333333 228) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></g></g><text x="525.3333333333333" y="247" class="display text" font-size="21">Rescued repos</text><text x="465.3333333333333" y="294" class="sans muted" font-size="15">repos that vanish upstream get a</text><text x="465.3333333333333" y="316" class="sans muted" font-size="15">badge, protection and a backup</text><rect x="858.6666666666666" y="194" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="858.6666666666666" y="194" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="882.6666666666666" y="218" width="44" height="44" rx="11" class="raised"/><g transform="translate(892.6666666666666 228) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3z"/></g></g><text x="942.6666666666666" y="247" class="display text" font-size="21">Any forge</text><text x="882.6666666666666" y="294" class="sans muted" font-size="15">GitHub, GitLab, Gitea, Codeberg</text><text x="882.6666666666666" y="316" class="sans muted" font-size="15">or any plain Git URL</text><rect x="24.0" y="364" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="24.0" y="364" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="48.0" y="388" width="44" height="44" rx="11" class="raised"/><g transform="translate(58.0 398) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="7"/><path d="M15.5 15.5l5.5 5.5M7.5 10.5l2 2 3.5-4"/></g></g><text x="108.0" y="417" class="display text" font-size="21">KodeKavach audit</text><text x="48.0" y="464" class="sans muted" font-size="15">leaked secrets, vulnerable deps,</text><text x="48.0" y="486" class="sans muted" font-size="15">risky workflows, poisoned agent files</text><rect x="441.3333333333333" y="364" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="441.3333333333333" y="364" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="465.3333333333333" y="388" width="44" height="44" rx="11" class="raised"/><g transform="translate(475.3333333333333 398) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3M12 14.5v2.5"/></g></g><text x="525.3333333333333" y="417" class="display text" font-size="21">Hardened git runner</text><text x="465.3333333333333" y="464" class="sans muted" font-size="15">hooks and fsmonitor never run;</text><text x="465.3333333333333" y="486" class="sans muted" font-size="15">no prompt can hang a run</text><rect x="858.6666666666666" y="364" width="397.3333333333333" height="150" rx="14" class="surface"/><rect x="858.6666666666666" y="364" width="397.3333333333333" height="150" rx="14" fill="none" class="rule" stroke-width="1"/><rect x="882.6666666666666" y="388" width="44" height="44" rx="11" class="raised"/><g transform="translate(892.6666666666666 398) scale(1.0)"><g fill="none" class="accents" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 14.5h3"/></g></g><text x="942.6666666666666" y="417" class="display text" font-size="21">Scheduled and offline</text><text x="882.6666666666666" y="464" class="sans muted" font-size="15">cron, launchd or Task Scheduler;</text><text x="882.6666666666666" y="486" class="sans muted" font-size="15">no telemetry, ever</text>
</svg>
