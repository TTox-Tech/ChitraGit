ed" font-size="14">M5</text><text x="777.5" y="142" text-anchor="middle" class="serif muted" font-size="18">Providers</text><circle cx="915.0" cy="102" r="7" class="bg rule" stroke-width="2"/><text x="915.0" y="74" text-anchor="middle" class="mono muted" font-size="14">M6</text><text x="915.0" y="142" text-anchor="middle" class="serif muted" font-size="18">Conflicts</text><circle cx="1052.5" cy="102" r="7" class="bg rule" stroke-width="2"/><text x="1052.5" y="74" text-anchor="middle" class="mono muted" font-size="14">M7</text><text x="1052.5" y="142" text-anchor="middle" class="serif muted" font-size="18">Experience</text><circle cx="1190.0" cy="102" r="7" class="bg rule" stroke-width="2"/><text x="1190.0" y="74" text-anchor="middle" class="mono muted" font-size="14">M8</text><text x="1190.0" y="142" text-anchor="middle" class="serif muted" font-size="18">Ship</text>
