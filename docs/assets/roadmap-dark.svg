<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-label="Roadmap: all nine milestones, M0 Foundation to M8 Ship, are done in v1.0.">
<style>
.bg{fill:#0A0C10} .surface{fill:#111418} .raised{fill:#1A1F26}
.rule{stroke:#2B313A} .rulef{fill:#2B313A}
.text{fill:#E6EDF3} .muted{fill:#8B949E} .accent{fill:#3B82F6} .accents{stroke:#3B82F6}
.sky{fill:#7DD3FC} .sage{fill:#72C795} .amber{fill:#E3B341} .sindoor{fill:#F47067}
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}
</style>
