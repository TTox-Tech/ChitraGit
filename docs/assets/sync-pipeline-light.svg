<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="Sync pipeline: scan, preflight, fetch, integrate, record. Integrate fast-forwards only when safe and keeps local changes; otherwise the repo is left as is with a recorded reason.">
<style>
@font-face{font-family:'M PLUS Code Latin';font-weight:100 700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.bg{fill:#F6F8FA} .surface{fill:#EEF1F5} .raised{fill:#E4E8EE}
.rule{stroke:#D0D7DE} .rulef{fill:#D0D7DE}
.text{fill:#0D1117} .muted{fill:#57606A} .accent{fill:#1D4ED8} .accents{stroke:#1D4ED8}
.sky{fill:#0E6A8C} .sage{fill:#1A7F37} .amber{fill:#9A6700} .sindoor{fill:#CF222E}
.display{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace;font-weight:600} .sans{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace} .mono{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace}

</style>
<rect x=".5" y=".5" width="1279" height="469" rx="18" class="bg rule" stroke-width="1"/>
<text x="40.0" y="42" class="sans muted" font-size="13" letter-spacing="3">HOW ONE REPO IS SYNCED  ·  ON A WORKER POOL, MANY AT ONCE</text>
<rect x="40.0" y="70" width="208" height="128" rx="14" class="surface"/><rect x="40.0" y="70" width="208" height="128" rx="14" fill="none" class="rule" stroke-width="1"/><text x="62.0" y="104" class="sans muted" font-size="12" letter-spacing="2">01</text><text x="62.0" y="136" class="display text" font-size="25">Scan</text><text x="62.0" y="162" class="sans muted" font-size="14">finds clones, mirrors,</text><text x="62.0" y="181" class="sans muted" font-size="14">worktrees, nested repos</text><rect x="288.0" y="70" width="208" height="128" rx="14" class="surface"/><rect x="288.0" y="70" width="208" height="128" rx="14" fill="none" class="rule" stroke-width="1"/><text x="310.0" y="104" class="sans muted" font-size="12" letter-spacing="2">02</text><text x="310.0" y="136" class="display text" font-size="25">Preflight</text><text x="310.0" y="162" class="sans muted" font-size="14">skips repos that are busy:</text><text x="310.0" y="181" class="sans muted" font-size="14">merge, rebase, index.lock</text><line x1="254.0" y1="134" x2="278.0" y2="134" class="rule" stroke-width="1.6"/><path d="M276.0 129 l7 5 l-7 5" fill="none" class="accents" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="536.0" y="70" width="208" height="128" rx="14" class="surface"/><rect x="536.0" y="70" width="208" height="128" rx="14" fill="none" class="rule" stroke-width="1"/><text x="558.0" y="104" class="sans muted" font-size="12" letter-spacing="2">03</text><text x="558.0" y="136" class="display text" font-size="25">Fetch</text><text x="558.0" y="162" class="sans muted" font-size="14">all branches and tags,</text><text x="558.0" y="181" class="sans muted" font-size="14">never prunes, retries</text><line x1="502.0" y1="134" x2="526.0" y2="134" class="rule" stroke-width="1.6"/><path d="M524.0 129 l7 5 l-7 5" fill="none" class="accents" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="784.0" y="70" width="208" height="128" rx="14" class="surface"/><rect x="784.0" y="70" width="208" height="128" rx="14" fill="none" class="accents" stroke-width="1.6"/><text x="806.0" y="104" class="sans muted" font-size="12" letter-spacing="2">04</text><text x="806.0" y="136" class="display text" font-size="25">Integrate</text><text x="806.0" y="162" class="sans muted" font-size="14">fast-forward when safe,</text><text x="806.0" y="181" class="sans muted" font-size="14">local changes kept</text><line x1="750.0" y1="134" x2="774.0" y2="134" class="rule" stroke-width="1.6"/><path d="M772.0 129 l7 5 l-7 5" fill="none" class="accents" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1032.0" y="70" width="208" height="128" rx="14" class="surface"/><rect x="1032.0" y="70" width="208" height="128" rx="14" fill="none" class="rule" stroke-width="1"/><text x="1054.0" y="104" class="sans muted" font-size="12" letter-spacing="2">05</text><text x="1054.0" y="136" class="display text" font-size="25">Record</text><text x="1054.0" y="162" class="sans muted" font-size="14">every ref change,</text><text x="1054.0" y="181" class="sans muted" font-size="14">old and new SHA</text><line x1="998.0" y1="134" x2="1022.0" y2="134" class="rule" stroke-width="1.6"/><path d="M1020.0 129 l7 5 l-7 5" fill="none" class="accents" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M888.0 198 V232 H450 V296" fill="none" class="rule" stroke-width="1.6"/><path d="M888.0 232 H920 V296" fill="none" class="rule" stroke-width="1.6"/><circle cx="888.0" cy="232" r="4" class="accent"/><rect x="250" y="296" width="400" height="120" rx="14" class="surface"/><rect x="250" y="296" width="400" height="120" rx="14" fill="none" class="rule" stroke-width="1"/><text x="274" y="334" class="mono sage" font-size="22">✓</text><text x="306" y="333" class="display text" font-size="19">Safe: move the branch ahead</text><text x="306" y="362" class="sans muted" font-size="14">no local commits; local changes are stashed</text><text x="306" y="382" class="sans muted" font-size="14">and put back. Other branches move too.</text><rect x="720" y="296" width="400" height="120" rx="14" class="surface"/><rect x="720" y="296" width="400" height="120" rx="14" fill="none" class="rule" stroke-width="1"/><text x="744" y="334" class="mono amber" font-size="22">!</text><text x="776" y="333" class="display text" font-size="19">Not safe: leave it exactly as is</text><text x="776" y="362" class="sans muted" font-size="14">new data is still downloaded; the reason is</text><text x="776" y="382" class="sans muted" font-size="14">recorded: ahead · diverged · conflict · …</text>
</svg>
