<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChitraGit ad</title>
<!--
  ChitraGit ad, 2:00 master.
  Every frame is a pure function of time: window.seek(t) draws time t (seconds).
  render.mjs steps t at the output frame rate and screenshots #stage (1920x1080).
  Palette: docs/brand.md. Font: M PLUS Code Latin (SIL OFL), files in ./fonts.
-->
<style>
@font-face{font-family:"MPC";src:url(fonts/mplus-code-latin-latin.woff2) format("woff2");font-weight:100 700;
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"MPC";src:url(fonts/mplus-code-latin-latin-ext.woff2) format("woff2");font-weight:100 700;
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --ink:#0A0C10;--surf:#111418;--surf2:#161A20;--rule:#2B313A;--shadow:#3D4550;
  --text:#E6EDF3;--muted:#8B949E;--neel:#3B82F6;--neel2:#60A5FA;--deep:#1E40AF;
  --aas:#7DD3FC;--sage:#72C795;--amber:#E3B341;--sind:#F47067;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0A0C10;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:var(--text);
  font-family:"MPC","DejaVu Sans Mono",monospace;font-weight:400;-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
#cam,.scene,.layer{position:absolute;inset:0}
.a{position:absolute;will-change:transform,opacity}
.d{font-weight:700;letter-spacing:-0.035em;line-height:1.02}
.m{font-weight:500}
.mu{color:var(--muted)} .ne{color:var(--neel)} .aa{color:var(--aas)} .sa{color:var(--sage)} .am{color:var(--amber)} .si{color:var(--sind)}
.eyebrow{font-weight:700;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.rule-h{position:absolute;left:0;height:2px;width:1920px;background:var(--rule);transform-origin:left center;opacity:.3}
.card{background:var(--surf);border:2px solid var(--rule);border-radius:16px}
.win{background:var(--surf);border:2px solid var(--rule);border-radius:22px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.bar{height:54px;border-bottom:2px solid var(--rule);display:flex;align-items:center;gap:12px;padding:0 22px;background:#0E1115}
.dot{width:14px;height:14px;border-radius:50%;background:var(--rule)}
.bar .t{margin-left:14px;color:var(--muted);font-size:20px}
.stamp{font-weight:700;font-size:62px;letter-spacing:.08em;padding:6px 26px;border:7px solid currentColor;border-radius:14px;text-transform:uppercase;white-space:nowrap}
.pill{border:2px solid var(--rule);border-radius:999px;padding:8px 22px;font-size:26px;color:var(--text);background:var(--surf);white-space:nowrap}
.chip{border:2px solid var(--rule);border-radius:10px;padding:3px 12px;font-size:18px;color:var(--muted);white-space:nowrap}
.k-kw{color:var(--neel2)} .k-ty{color:var(--aas)} .k-str{color:var(--sage)} .k-cm{color:var(--muted)} .k-num{color:var(--amber)}
#subs{position:absolute;left:0;right:0;top:950px;height:90px;text-align:center;font-size:44px;font-weight:500;letter-spacing:-0.01em}
#subs .w{display:inline-block;margin:0 .14em;will-change:transform,opacity}
.wipe{position:absolute;left:0;width:1920px;background:var(--surf2);transform-origin:left}
</style>
</head>
<body>
<div id="stage"><div id="cam"></div><div id="subs"></div><div id="fx" class="layer" style="pointer-events:none"></div></div>
<script>
"use strict";
// ======================= math =======================
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eOut=p=>1-Math.pow(1-p,4);
const expo=p=>p>=1?1:1-Math.pow(2,-10*p);
const eIn=p=>p*p*p;
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const sine=p=>-(Math.cos(Math.PI*p)-1)/2;
// Damped spring 0 -> 1. x = seconds since start; k stretches time.
const spring=(x,k=1)=>x<=0?0:1-Math.exp(-7.5*x/k)*Math.cos(14*x/k);
// Squash-and-stretch wobble after an impact at x = 0.
const squash=x=>{if(x<=0)return[1,1];const w=Math.exp(-7*x)*Math.sin(20*x)*.16;return[1+w,1-w]};
const fmt=n=>Math.round(n).toLocaleString("en-US");
const rnd=(i)=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}; // deterministic noise

// ======================= DOM =======================
const cam=document.getElementById("cam"), subsBox=document.getElementById("subs"), fx=document.getElementById("fx");
const $=(html,parent,cls,style)=>{const d=document.createElement("div");if(cls)d.className=cls;if(style)d.style.cssText=style;if(html!=null)d.innerHTML=html;(parent||cam).appendChild(d);return d};
function put(el,{x=0,y=0,s=1,sx=1,sy=1,r=0,ry=0,rx=0,o=1}={}){
  const persp=(rx||ry)?"perspective(1600px) ":"";
  el.style.transform=`${persp}translate(${x}px,${y}px) rotate(${r}deg) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s*sx},${s*sy})`;
  const oo=o<0.003?0:Math.min(1,o);el.style.opacity=oo;el.style.visibility=oo?"visible":"hidden";
}
const hide=el=>{el.style.opacity=0;el.style.visibility="hidden"};
function typed(el,text,t,a,cps=22){const n=Math.max(0,Math.min(text.length,Math.floor((t-a)*cps)));el.textContent=text.slice(0,n);return n>=text.length}
// Enter over `ain`, hold, leave over `aout`. Returns the entry progress.
function show(el,t,a,b,{dx=0,dy=36,s0=1,ain=.5,aout=.3,r0=0,ox=0,oy=-24}={}){
  if(t<a||t>b){hide(el);return 0}
  const i=expo(P(t,a,a+ain)),o=eIn(P(t,b-aout,b));
  put(el,{x:dx*(1-i)+ox*o,y:dy*(1-i)+oy*o,s:lerp(s0,1,i),r:r0*(1-i),o:Math.min(1,i*1.6)*(1-o)});return i;
}
// Springy pop with squash.
function pop(el,t,a,b,{s0=.2,k=.8,r0=0,aout=.25,y0=0}={}){
  if(t<a||t>b){hide(el);return}
  const x=t-a,sp=spring(x,k),[sx,sy]=squash(x-.18*k),o=eIn(P(t,b-aout,b));
  put(el,{s:lerp(s0,1,sp)*(1-.15*o),sx,sy,r:r0*(1-clamp(x/.4)),y:y0*(1-sp),o:clamp(x/.08)*(1-o)});
}
// Count up text.
const count=(el,t,a,b,to,from=0,suffix="")=>{el.textContent=fmt(lerp(from,to,eIO(P(t,a,b))))+suffix};

// Camera kicks [time, px].
const kicks=[];
function shake(t){let x=0,y=0;for(const[k,a]of kicks){const d=t-k;if(d>0&&d<.5){const e=Math.exp(-d*12)*a;x+=Math.sin(d*80)*e;y+=Math.cos(d*63)*e}}return[x,y]}

function stamp(text,color,parent,left,top,rot){
  const s=$(text,parent,"a stamp",`left:${left}px;top:${top}px;color:${color}`);
  return (t,ts,tout)=>{const x=t-ts;if(x<0||t>tout){hide(s);return}
    const p=clamp(x/.14),[sx,sy]=squash(x-.14);
    put(s,{s:x<.14?lerp(2.6,1,eIn(p)):1,sx,sy,r:rot,o:clamp(x/.07)*(1-P(t,tout-.25,tout))});};
}
function win(parent,title,style,body=""){return $(`<div class="bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="t">${title}</div></div>${body}`,parent,"a win",style)}
const svg=(w,h,vb,inner,style="")=>`<svg width="${w}" height="${h}" viewBox="${vb}" style="${style}" fill="none" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;

// ======================= background ledger =======================
const bg=$(null,cam,"layer");
const rules=[];for(let i=1;i<27;i++)rules.push($(null,bg,"rule-h",`top:${i*40}px`));
const margin=$(null,bg,"a",`left:120px;top:0;width:3px;height:1080px;background:var(--neel);opacity:.45;transform-origin:top`);
const END=120;
function bgUpdate(t){
  rules.forEach((r,i)=>{const a=.05+i*.025,inn=eOut(P(t,a,a+.8)),b=END-.9+i*.012,out=eIO(P(t,b,b+.5));
    r.style.transform=out>0?`translateX(${out*1920}px) scaleX(${1-out})`:`scaleX(${inn})`;});
  margin.style.transform=`scaleY(${eOut(P(t,.5,1.3))*(1-eIO(P(t,END-.7,END-.25)))})`;
}

// ======================= transitions (fx layer) =======================
// Ledger wipe: ruled bars sweep across and carry the cut underneath.
const wipeBars=Array.from({length:12},(_,i)=>$(null,fx,"wipe",`top:${i*90}px;height:92px`));
const wipes=[];
function wipeUpdate(t){
  let active=null;for(const w of wipes)if(t>=w-.45&&t<=w+.45)active=w;
  wipeBars.forEach((b,i)=>{if(active==null){hide(b);return}
    const d=i*.025,inn=eIO(P(t,active-.45+d,active-.05+d)),out=eIO(P(t,active+.02+d,active+.42+d));
    b.style.transformOrigin=out>0?"right":"left";put(b,{sx:out>0?1-out:inn,o:1})});
}
// Iris: circle mask on a scene root.
const iris=(el,t,a,b,cx,cy,open=true)=>{const p=eIO(P(t,a,b));const r=open?lerp(0,2300,p):lerp(2300,0,p);el.style.clipPath=`circle(${r}px at ${cx}px ${cy}px)`};

// ======================= subtitles =======================
// [start, end, text]; *word* = blue. Words appear over the first 70% of the line's time.
const SUBS=[
 [0.6,4.2,"Every developer has a folder like this."],
 [4.3,8.3,"Projects you learned from, depended on, or just didn't want to lose."],
 [8.4,10.9,"A few hundred clones. Then a few *thousand*."],
 [11.0,14.0,"Most haven't been pulled in a year. When one is taken down upstream, yours is the *last copy*."],
 [14.4,19.6,"ChitraGit keeps that archive *current*, keeps it *safe*, and lets you read it like *GitHub*."],
 [19.8,23.8,"On your machine. No account. No cloud."],
 [24.2,29.6,"Run one command. It finds every repository and updates them *in parallel*,"],
 [29.7,33.2,"within each host's *rate limits*."],
 [33.4,38.0,"Work in progress is set aside, and handed back *untouched*."],
 [38.2,41.6,"Branches only move forward when it's safe: no merges, no rebases, no deleted commits."],
 [41.8,46.0,"Kill it halfway, and the next run *finishes the job*."],
 [46.4,49.6,"Then comes the part no backup tool offers."],
 [49.8,55.0,"Browse any repository the way you would online: highlighted files, *blame* on every line,"],
 [55.1,60.0,"every commit with its full *diff*. Compare any two tags."],
 [60.2,65.0,"Search all *five thousand* at once, and land on the exact line."],
 [65.2,71.0,"Issues, pull requests, releases and wikis are archived beside the code, so the reasoning *outlives the website*."],
 [71.2,76.0,"Prefer a browser? *chitragit serve* puts the whole archive on localhost."],
 [76.4,81.0,"Every sync is a *snapshot*, its objects pinned so garbage collection can't touch them."],
 [81.2,86.0,"History rewritten upstream? *Restore* any repository to any point,"],
 [86.1,89.0,"or *undo* an entire run."],
 [89.2,95.8,"Every action lands in a *hash-chained ledger*, and verify checks it end to end."],
 [96.2,99.4,"Hooks in archived code never run. Tokens stay in your *keychain*."],
 [99.6,104.2,"*KodeKavach* audits for leaked secrets, vulnerable dependencies and risky workflows. Offline."],
 [104.4,109.8,"Vanished repos are *rescued* and locked, and a mirror keeps a second copy on your *NAS*."],
 [110.2,114.0,"GitHub, GitLab, Gitea, Bitbucket, or any Git URL. One signed binary. *Zero telemetry*."],
 [114.6,119.2,"ChitraGit. Every commit, accounted for."],
];
const subLines=SUBS.map(([a,b,txt])=>{
  const line=$(null,subsBox,"a",`left:0;right:0;top:0;text-align:center`);
  const words=txt.split(" ").map(w=>{const blue=/\*/.test(w);const span=document.createElement("span");span.className="w";span.textContent=w.replace(/\*/g,"");if(blue)span.style.color="var(--neel2)";else span.style.color="var(--text)";line.appendChild(span);return span});
  return {a,b,line,words};
});
function subsUpdate(t){
  for(const L of subLines){
    if(t<L.a-.05||t>L.b){hide(L.line);continue}
    const out=eIn(P(t,L.b-.3,L.b));put(L.line,{y:-18*out,o:1-out});
    const span=(L.b-L.a)*.62,n=L.words.length;
    L.words.forEach((w,i)=>{const s=L.a+span*i/n,x=t-s;put(w,{y:lerp(22,0,expo(clamp(x/.35))),o:clamp(x/.18)})});
  }
}

// ======================= scenes =======================
const scenes=[];
function scene(a,b,build){const root=$(null,cam,"scene");scenes.push({a,b,root,upd:build(root)})}

// ---------- 1. The folder (0 - 14.2) ----------
scene(0,14.4,root=>{
  // folder
  const folder=$(svg(300,240,"0 0 150 120",`<path d="M8 22 h46 l12 12 h76 v76 h-134 z" fill="#111418" stroke="#3B82F6" stroke-width="3"/><path class="lid" d="M8 40 h134 v70 h-134 z" fill="#161A20" stroke="#3B82F6" stroke-width="3"/>`),root,"a",`left:810px;top:330px`);
  const lid=folder.querySelector(".lid"); lid.style.transformOrigin="75px 110px";
  const flabel=$("~/archive",root,"a m mu",`left:810px;top:590px;width:300px;text-align:center;font-size:30px`);
  // tiles that pour out of the folder into a grid
  const names=["torvalds/linux","golang/go","rust-lang/rust","kubernetes/kubernetes","facebook/react","you/dotfiles","denoland/deno","python/cpython","nodejs/node","vercel/next.js","sveltejs/svelte","neovim/neovim","microsoft/vscode","rails/rails","django/django","hashicorp/terraform","grafana/grafana","prometheus/prometheus","someone/vanished","apple/swift","ziglang/zig","tokio-rs/tokio","astral-sh/ruff","bevyengine/bevy","tauri-apps/tauri","laravel/laravel","flutter/flutter","godotengine/godot","ollama/ollama","redis/redis","postgres/postgres","nginx/nginx","sqlite/sqlite","curl/curl","git/git","llvm/llvm-project","ffmpeg/ffmpeg","mozilla/gecko-dev","elixir-lang/elixir","JuliaLang/julia","charmbracelet/vhs","junegunn/fzf","BurntSushi/ripgrep","sharkdp/bat","helix-editor/helix","caddyserver/caddy","traefik/traefik","minio/minio"];
  const COLS=6,ROWS=8,TW=272,TH=82,GX=196,GY=130;
  const tiles=names.map((n,i)=>{
    const el=$(`<div style="font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${n}</div><div class="ag mu" style="font-size:15px;margin-top:6px">main · <span class="dt">pulled today</span></div>`,root,"a card",`left:0;top:0;width:${TW-16}px;height:${TH-14}px;padding:10px 14px;border-radius:12px`);
    const c=i%COLS,r=Math.floor(i/COLS);
    return {el,n,tx:GX+c*(TW+0),ty:GY+r*(TH+10),dt:el.querySelector(".dt")};
  });
  const target=18; // someone/vanished
  const counter=$(`<span class="v">0</span>`,root,"a d",`left:1400px;top:110px;width:440px;font-size:96px;text-align:right;transform-origin:right`);
  const counterL=$(`repos`,root,"a m mu",`left:1700px;top:228px;font-size:30px;width:140px;text-align:right`);
  const clock=$(svg(120,120,"0 0 60 60",`<circle cx="30" cy="30" r="26" stroke="#8B949E" stroke-width="3"/><path class="h" d="M30 30 V14" stroke="#E3B341" stroke-width="3"/><path d="M30 30 L40 36" stroke="#8B949E" stroke-width="3"/>`),root,"a",`left:1730px;top:420px`);
  const hand=clock.querySelector(".h"); hand.style.transformOrigin="30px 30px";
  const st404=stamp("404","var(--sind)",root,0,0,8);
  const last=$(`<span class="ne">your copy</span> · the last one left`,root,"a pill",`left:0;top:0;font-size:24px;border-color:var(--neel)`);
  kicks.push([10.9,10]);
  return t=>{
    // folder pops, lid opens, then folder shrinks to the corner
    const fo=eIO(P(t,3.4,4.2));
    pop(folder,t,.5,14.4,{s0:.3});
    if(t>=.5){const f=spring(t-.5,.8),[sx,sy]=squash(t-.68);put(folder,{y:lerp(0,120,fo),s:lerp(.3,1,f)*lerp(1,.6,fo),sx,sy,o:clamp((t-.5)/.1)*(1-fo)})}
    lid.style.transform=`rotateX(${lerp(0,62,eOut(P(t,1.4,2.0)))}deg)`;
    show(flabel,t,.8,3.5,{dy:16});
    // tiles fly out of the folder (centre 960,450) on an arc into the grid
    tiles.forEach((T,i)=>{
      const a=1.7+i*.065,x=t-a; if(x<0){hide(T.el);return}
      const p=eIO(clamp(x/.75)),arc=Math.sin(p*Math.PI)*-160;
      let X=lerp(830,T.tx,p),Y=lerp(420,T.ty,p)+arc,S=lerp(.2,1,eOut(clamp(x/.5))),R=lerp(rnd(i)*40-20,0,p),O=1;
      // zoom into the vanished tile 10.0 - 12.6
      const z=eIO(P(t,10.0,11.0));
      if(z>0){const cx=tiles[target].tx+TW/2,cy=tiles[target].ty+TH/2,Z=lerp(1,2.6,z);
        X=960+(X+TW/2-cx)*Z-TW/2; Y=480+(Y+TH/2-cy)*Z-TH/2; S*=Z; if(i!==target)O=lerp(1,.18,z)}
      const out=eIn(P(t,13.5,14.1)); O*=1-out;
      put(T.el,{x:X,y:Y,s:S,r:R,o:O*clamp(x/.12)});
      // ageing: tiles go stale 6.5 - 9.0
      const stale=(i%3!==0)&&t>6.4+rnd(i+3)*2.2;
      T.dt.textContent=(i===target&&t>10.9)?"upstream: 404":stale?`pulled ${["Mar 2024","Nov 2023","Aug 2024","Jan 2024"][i%4]}`:"pulled today";
      T.el.style.color=stale?"var(--muted)":"var(--text)";
      const dead=i===target&&t>10.9;
      T.el.style.background=dead?"#000":stale?"#0D1014":"var(--surf)";
      T.el.style.borderColor=dead?"var(--sind)":(i===target&&t>12.0?"var(--neel)":"var(--rule)");
    });
    // counter
    const cv=counter.querySelector(".v");
    if(t<8.4)count(cv,t,1.8,5.0,312); else count(cv,t,8.4,10.4,5000,312);
    const cpop=t>8.4&&t<9?squash(t-8.4):[1,1];
    show(counter,t,1.8,10.0,{dy:-30}); if(t>=1.8&&t<=10.0)counter.style.transform+=` scale(${cpop[0]},${cpop[1]})`;
    show(counterL,t,1.9,10.0,{dy:-20});
    show(clock,t,6.3,9.9,{s0:.4});hand.style.transform=`rotate(${(t-6.3)*540}deg)`;
    // 404 and "last copy"
    const T=tiles[target],Z=2.6,cx=960,cy=480;
    st404(t,10.9,13.6); const s4=document.querySelector(".stamp"); // positioned below
    last.style.left="640px";last.style.top="300px"; pop(last,t,12.0,13.6,{s0:.4});
  };
});
// position the 404 stamp (built inside scene 1) once
// (it sits over the zoomed tile)

// ---------- 2. The promise (14 - 24) ----------
scene(14,24.3,root=>{
  // page turn in from the folder scene
  const logo=$(svg(240,240,"0 0 120 120",
    `<rect x="4" y="4" width="112" height="112" rx="24" fill="#111418" stroke="#2B313A" stroke-width="3"/>
     <path class="mg" d="M38 20 V100" stroke="#3B82F6" stroke-width="6"/>
     <path class="br" d="M38 40 C60 46 62 58 52 66 C44 72 40 76 38 84" stroke="#3B82F6" stroke-width="6"/>
     <circle class="c1" cx="38" cy="40" r="7" fill="#3B82F6"/><circle class="c2" cx="56" cy="62" r="7" fill="#3B82F6"/><circle class="c3" cx="38" cy="84" r="7" fill="#3B82F6"/>
     <path class="l1" d="M70 38 H96" stroke="#8B949E" stroke-width="5"/><path class="l2" d="M70 52 H96" stroke="#8B949E" stroke-width="5"/><path class="l3" d="M70 66 H96" stroke="#8B949E" stroke-width="5"/><path class="l4" d="M70 80 H90" stroke="#8B949E" stroke-width="5"/>`),root,"a",`left:840px;top:170px`);
  const parts=["mg","br","l1","l2","l3","l4"].map(c=>{const p=logo.querySelector("."+c);const L=p.getTotalLength?p.getTotalLength():100;p.style.strokeDasharray=L;return [p,L]});
  const dots=["c1","c2","c3"].map(c=>logo.querySelector("."+c));
  const word=$(null,root,"a d",`left:0;top:460px;width:1920px;text-align:center;font-size:190px;white-space:nowrap`);

      const a=76.5+i*.14,x=t-a;if(x<0||t>89.2){hide(p);return}
      let y=lerp(-560,0,spring(x,.9)),r=0,o=clamp(x*6),ry=0;
      if(i===5){const tear=eIn(P(t,82.0,82.7)),back=spring(t-84.2,.8);const f=t<84.2?tear:1-back;y+=f*520;r=f*26;}
      // undo: run pages 44-46 flip together 86.4 - 87.4
      if(i>=3){ry=Math.sin(P(t,86.5,87.3)*Math.PI)*-180*(t<87.3?1:0)}
      const out=eIn(P(t,88.8,89.2));
      put(p,{y:y-out*60,r,ry,o:o*(1-out)});
    });
    pins.forEach((pn,i)=>{const x=t-(78.0+i*.12);put(pn,{y:lerp(-80,0,spring(x,.6)),o:x>0?1:0})});
    pop(pinned,t,78.1,81.0,{s0:.5});
    // gc broom sweeps across 79.2 - 80.9 and bounces off each pinned page
    if(t>79.0&&t<81.0){const p=P(t,79.1,80.8);const bx=lerp(120,1700,sine(p));const bump=Math.abs(Math.sin(p*Math.PI*6))*-24;put(broom,{x:bx,y:bump+300,r:Math.sin(p*40)*8,o:Math.min(1,(t-79)*6,(81-t)*6)})}else hide(broom);
    pop(bolt,t,82.0,83.6,{s0:.4});
    show(term,t,83.0,89.0,{dy:60});
    if(t<85.9)typed(tc,"chitragit restore torvalds/linux --to 45",t,83.2,30);else typed(tc,"chitragit undo --run 46",t,86.0,24);
    stR(t,84.6,86.0); stU(t,87.3,88.9);
    // 89.2 - 96: hash chain + verify + tamper
    put(chain,{o:t>=89.2&&t<96.3?Math.min(1,(t-89.2)*5,(96.3-t)*5):0});
    blocks.forEach((b,i)=>{const x=t-(89.4+i*.16);put(b,{y:lerp(80,0,spring(x,.8)),o:clamp(x*6)})});
    links.forEach((l,i)=>{const x=t-(89.7+i*.16);l.style.transform=`scaleX(${eOut(clamp(x/.3))})`;l.style.background=(i===1&&t>93.4)?"var(--amber)":"var(--neel)";l.style.opacity=(i===1&&t>93.4)?(Math.floor(t*6)%2?1:.3):1});
    pop(verify,t,90.6,96.3,{s0:.5});
    const sc1=P(t,91.0,92.6),sc2=P(t,94.0,95.2);
    const scanX=t<93?lerp(170,170+5*270+214,sine(sc1)):lerp(170,170+2*270,sine(sc2));
    put(scanner,{x:scanX,o:(t>91&&t<92.7)||(t>94&&t<95.3)?1:0});
    // tamper: block 2's hash changes at 93.2
    const h2=blocks[2].querySelector(".h");h2.textContent=t>93.2?"7d1a9e…":"2c26b4…";h2.style.color=t>93.2?"var(--amber)":"var(--text)";
    blocks[2].style.borderColor=t>93.2?"var(--amber)":"var(--rule)";
    if(t>92.6&&t<93.3){vres.innerHTML=`<span class="sa">✓ ledger intact · 1,047 events · objects present</span>`}else if(t>95.2){vres.innerHTML=`<span class="am">✗ event 1044 was edited · chain breaks at 2c26b4</span>`}else vres.innerHTML="";
    put(vres,{o:(t>92.6&&t<93.3)||t>95.2?1:0});
  };
});
wipes.push(96.2);

// ---------- 6. Security (96 - 110) ----------
scene(96,110.3,root=>{
  const repo=$(`<div style="font-size:28px" class="m">~/archive/some/repo</div><div class="mu" style="font-size:20px;margin-top:8px">.git/hooks/post-merge</div>`,root,"a card",`left:300px;top:300px;width:500px;height:150px;padding:30px 34px`);

  const shield=$(svg(200,230,"0 0 40 46",`<path d="M20 2l16 6v14c0 10-7 17-16 22C11 39 4 32 4 22V8z" fill="#111418" stroke="#3B82F6" stroke-width="3"/><path d="M13 23l5 5 9-10" stroke="#3B82F6" stroke-width="3.5"/>`),root,"a",`left:1080px;top:260px`);

  const tokenTxt=$(`<span class="mu">token:</span> <span class="am">ghp_••••••••</span>`,root,"a",`left:300px;top:700px;font-size:24px`);
  // KodeKavach
  const kk=win(root,"chitragit audit · KodeKavach",`left:160px;top:180px;width:1000px;height:640px`,`<div class="ls" style="padding:24px 32px;font-size:23px;line-height:1.85"></div>`);
  const kl=['<span class="k-kw">const</span> api = <span class="k-str">"https://api.example.com"</span>','<span class="k-kw">const</span> retries = <span class="k-num">3</span>','<span class="k-cm">// TODO: move to env</span>','<span class="k-kw">const</span> token = <span class="k-str">"ghp_9fK2••••••••••••Qx"</span>','<span class="k-kw">export</span> { api, retries, token }','','<span class="k-cm"># go.mod</span>','golang.org/x/net v0.17.0','','<span class="k-cm"># .github/workflows/ci.yml</span>','run: curl -s $URL | sh'];
  const klEls=kl.map(h=>$(h||"&nbsp;",kk.querySelector(".ls"),null,"white-space:pre;padding:0 10px;border-radius:6px"));
  const scanBar=$(null,kk,"a",`left:0;top:78px;width:1000px;height:4px;background:var(--neel)`);
  const flags=[["secret · high",3,"amber"],["CVE-2023-44487",7,"amber"],["pipe to shell",10,"amber"]].map(([l,row,c])=>$(l,root,"a pill",`left:900px;top:${180+54+24+row*42.5}px;font-size:18px;padding:3px 12px;color:var(--${c});border-color:var(--${c})`));
  const kStats=[["3","secrets"],["12","vulnerable deps"],["2","risky workflows"]].map(([n,l],i)=>$(`<div class="d" style="font-size:90px">${n}</div><div class="mu" style="font-size:24px">${l}</div>`,root,"a",`left:1260px;top:${200+i*170}px`));
  const offline=$(svg(40,40,"0 0 24 24",`<path d="M2 16l20-6-20-6 4 6z" stroke="#3B82F6" stroke-width="2"/>`)+`<span style="font-size:24px"> offline · 0 bytes uploaded</span>`,root,"a pill",`left:1260px;top:720px;display:flex;align-items:center;gap:10px;border-color:var(--neel)`);
  // rescued + mirror
  const vcard=$(`<div style="font-size:36px" class="m">someone/vanished</div><div class="mu" style="font-size:22px;margin-top:14px">upstream 404 since Nov 6 · yours: 1,912 commits · 14 branches</div>`,root,"a card",`left:300px;top:250px;width:1000px;height:180px;padding:40px 48px;background:#000;border-color:var(--sind)`);
  const lock=$(svg(90,110,"0 0 30 36",`<rect x="3" y="15" width="24" height="19" rx="4" fill="#7DD3FC"/><path d="M8 15 V10 a7 7 0 0 1 14 0 V15" stroke="#7DD3FC" stroke-width="4"/>`),root,"a",`left:1190px;top:170px`);
  const stRes=stamp("rescued ★","var(--aas)",root,1000,380,-7);
  const disk=(lbl,x)=>$(svg(190,140,"0 0 40 30",`<rect x="1" y="1" width="38" height="28" rx="5" fill="#111418" stroke="#2B313A" stroke-width="1.5"/><circle cx="31" cy="22" r="2" fill="#3B82F6"/><rect x="6" y="7" width="20" height="2" fill="#2B313A"/><rect x="6" y="12" width="14" height="2" fill="#2B313A"/>`)+`<div style="font-size:24px;text-align:center;margin-top:10px">${lbl}</div>`,root,"a",`left:${x}px;top:570px;width:190px`);
  const d1=disk("~/archive",420),d2=disk("nas:/backup",1300);

  const checks=["ledger ✓","objects ✓","bundles ✓","nightly 02:00"].map((c,i)=>$(c,root,"a pill",`left:${420+i*280}px;top:800px;font-size:22px;${i<3?"color:var(--sage);border-color:#72C79566":""}`));

    checks.forEach((c,i)=>pop(c,t,107.8+i*.2,110.2,{s0:.4}));

});

  const star=$(`★ Star`,root,"a pill ne",`left:1160px;top:752px;font-size:28px;border-color:var(--neel)`);
  return t=>{
    if(!fx){const w=fEls.map(e=>e.offsetWidth),tot=w.reduce((a,b)=>a+b,0)+18*(w.length-1);let x=(1920-tot)/2;fx=w.map(v=>{const r=x;x+=v+18;return r})}
    const fo=eIO(P(t,113.8,114.3));

      const ang=i/9*Math.PI*2+(t-110)*.6,orb=1-eIO(clamp(x/.9));
      const [sx,sy]=squash(x-.7);put(e,{x:lerp(fx[i],960+Math.cos(ang)*600-80,orb),y:lerp(380,420+Math.sin(ang)*260,orb)-fo*60,sx,sy,o:clamp(x*6)*(1-fo)})});

    const end=eIO(P(t,119.1,119.5));

    show(word,t,114.6,119.6,{dx:60,dy:0,aout:.4});show(tag,t,114.9,119.6,{dy:20,aout:.4});
    cEls.forEach(([e,c,el,ok],i)=>{const a=115.4+i*.75;show(e,t,a,119.6,{dy:30,aout:.4});typed(el,c,t,a+.1,40);
      const ox=t-(a+.1+c.length/40+.1);ok.style.opacity=ox>0?Math.min(1,ox*8):0;e.style.borderColor=(ox>0&&ox<.3)?"var(--sage)":"var(--rule)"});

});
