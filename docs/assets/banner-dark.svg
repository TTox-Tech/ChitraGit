<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ChitraGit: the keeper of your Git archive">
<style>
.bg{fill:#16120E} .surface{fill:#1F1A14} .raised{fill:#2A231C}
.rule{stroke:#3D342A} .rulef{fill:#3D342A}
.text{fill:#EFE6D6} .muted{fill:#A39684} .accent{fill:#E58A45} .accents{stroke:#E58A45}
.brass{fill:#CDB27A} .sage{fill:#8DB58A} .amber{fill:#DDA654} .sindoor{fill:#E07A66}
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}

</style>
<defs><clipPath id="r"><rect width="1280" height="360" rx="18"/></clipPath></defs>
<g clip-path="url(#r)">
  <rect width="1280" height="360" class="bg"/>
  <line x1="0" y1="36" x2="1280" y2="36" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="72" x2="1280" y2="72" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="108" x2="1280" y2="108" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="144" x2="1280" y2="144" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="180" x2="1280" y2="180" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="216" x2="1280" y2="216" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="252" x2="1280" y2="252" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="288" x2="1280" y2="288" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="324" x2="1280" y2="324" class="rule" stroke-width="1" opacity=".55"/>
  <line x1="56" y1="0" x2="56" y2="360" class="accents" stroke-width="1.5" opacity=".9"/>
  <line x1="62" y1="0" x2="62" y2="360" class="accents" stroke-width="1" opacity=".45"/>
  <rect x="776" y="62" width="468" height="220" rx="12" class="surface" opacity=".92"/>
  <rect x="776" y="62" width="468" height="220" rx="12" fill="none" class="rule" stroke-width="1"/>
  <text x="812" y="106" class="mono sage" font-size="17">✓</text><text x="838" y="106" class="mono text" font-size="16">torvalds/linux</text><text x="812" y="142" class="mono muted" font-size="17">·</text><text x="838" y="142" class="mono text" font-size="16">golang/go</text><text x="812" y="178" class="mono sage" font-size="17">✓</text><text x="838" y="178" class="mono text" font-size="16">charmbracelet/bubbletea</text><text x="812" y="214" class="mono amber" font-size="17">!</text><text x="838" y="214" class="mono text" font-size="16">you/dotfiles</text><text x="812" y="250" class="mono brass" font-size="17">★</text><text x="838" y="250" class="mono text" font-size="16">someone/vanished-tool</text>
  <text x="1216" y="106" text-anchor="end" class="sans muted" font-size="14">412 new commits</text><text x="1216" y="142" text-anchor="end" class="sans muted" font-size="14">up to date</text><text x="1216" y="178" text-anchor="end" class="sans muted" font-size="14">1 new branch</text><text x="1216" y="214" text-anchor="end" class="sans muted" font-size="14">uncommitted, left as is</text><text x="1216" y="250" text-anchor="end" class="sans muted" font-size="14">kept safe</text>
</g>
<g transform="translate(96 46) scale(1.0)">
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#1F1A14" stroke="#3D342A" stroke-width="1.5"/>
  <g stroke="#EFE6D6" stroke-opacity=".32" stroke-width="2.4" stroke-linecap="round">
    <line x1="40" y1="19" x2="51" y2="19"/><line x1="40" y1="28" x2="51" y2="28"/>
    <line x1="40" y1="37" x2="51" y2="37"/><line x1="40" y1="46" x2="51" y2="46"/>
  </g>
  <g fill="none" stroke="#E58A45" stroke-width="2.6" stroke-linecap="round">
    <line x1="20" y1="12" x2="20" y2="52"/>
    <path d="M20 19 C20 27 31 25 31 32 C31 39 20 37 20 46"/>
  </g>
  <circle cx="20" cy="19" r="4.2" fill="#E58A45"/>
  <circle cx="31" cy="32" r="3.8" fill="#1F1A14" stroke="#E58A45" stroke-width="2.4"/>
  <circle cx="20" cy="46" r="4.2" fill="#E58A45"/>
</g>
<text x="96" y="196" class="serif text" font-size="78" letter-spacing="-1">Chitra<tspan class="accent">Git</tspan></text>
<text x="98" y="244" class="serif muted" font-size="26" font-style="italic">The keeper of your Git archive.</text>
<text x="98" y="308" class="sans muted" font-size="14" letter-spacing="3">SYNC  ·  BROWSE  ·  PROTECT  ·  5,000+ REPOS  ·  OFFLINE</text>

<rect x=".5" y=".5" width="1279" height="359" rx="18" fill="none" class="rule" stroke-width="1"/>
</svg>
