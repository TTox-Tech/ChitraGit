<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 512" width="1280" height="512" role="img" aria-label="Animated terminal: chitragit sync updates every repo in parallel and explains each one it leaves alone">
<style>
.bg{fill:#16120E} .surface{fill:#1F1A14} .raised{fill:#2A231C}
.rule{stroke:#3D342A} .rulef{fill:#3D342A}
.text{fill:#EFE6D6} .muted{fill:#A39684} .accent{fill:#E58A45} .accents{stroke:#E58A45}
.brass{fill:#CDB27A} .sage{fill:#8DB58A} .amber{fill:#DDA654} .sindoor{fill:#E07A66}
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif} .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}
@keyframes p0{0%,0.00%{opacity:0}0.75%,91.25%{opacity:1}94.38%,100%{opacity:0}}.p0{animation:p0 16.0s linear infinite both}@keyframes ty{0%{transform:translateX(0)}4.38%{transform:translateX(0.0px)}4.91%{transform:translateX(10.2px)}5.45%{transform:translateX(20.5px)}5.98%{transform:translateX(30.8px)}6.52%{transform:translateX(41.0px)}7.05%{transform:translateX(51.2px)}7.59%{transform:translateX(61.5px)}8.12%{transform:translateX(71.8px)}8.66%{transform:translateX(82.0px)}9.20%{transform:translateX(92.2px)}9.73%{transform:translateX(102.5px)}10.27%{transform:translateX(112.8px)}10.80%{transform:translateX(123.0px)}11.34%{transform:translateX(133.2px)}11.88%{transform:translateX(143.5px)}100%{transform:translateX(143.5px)}}.ty{animation:ty 16.0s steps(1,end) infinite both}@keyframes cmd{0%,0.00%{opacity:0}0.75%,91.25%{opacity:1}94.38%,100%{opacity:0}}.cmd{animation:cmd 16.0s linear infinite both}@keyframes l0{0%,15.62%{opacity:0}16.38%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l0{animation:l0 16.0s linear infinite both}@keyframes l1{0%,18.25%{opacity:0}19.00%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l1{animation:l1 16.0s linear infinite both}@keyframes l2{0%,20.88%{opacity:0}21.62%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l2{animation:l2 16.0s linear infinite both}@keyframes l3{0%,23.50%{opacity:0}24.25%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l3{animation:l3 16.0s linear infinite both}@keyframes l4{0%,26.12%{opacity:0}26.88%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l4{animation:l4 16.0s linear infinite both}@keyframes l5{0%,28.75%{opacity:0}29.50%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l5{animation:l5 16.0s linear infinite both}@keyframes l6{0%,31.37%{opacity:0}32.12%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l6{animation:l6 16.0s linear infinite both}@keyframes l7{0%,34.00%{opacity:0}34.75%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l7{animation:l7 16.0s linear infinite both}@keyframes l8{0%,36.62%{opacity:0}37.38%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l8{animation:l8 16.0s linear infinite both}@keyframes l9{0%,39.25%{opacity:0}40.00%,91.25%{opacity:1}94.38%,100%{opacity:0}}.l9{animation:l9 16.0s linear infinite both}@keyframes pf{0%,43.00%{opacity:0}43.75%,91.25%{opacity:1}94.38%,100%{opacity:0}}.pf{animation:pf 16.0s linear infinite both}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1,end) infinite}.textb{fill:#EFE6D6;font-weight:700}@media (prefers-reduced-motion: reduce){.p0,.cmd,.pf,.l0,.l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.l9{animation:none;opacity:1}.ty{animation:none;transform:translateX(200px)}.cur{animation:none}}
</style>
<rect x=".5" y=".5" width="1279" height="511" rx="16" class="surface rule" stroke-width="1"/>
<path d="M.5 52 V16.5 a16 16 0 0 1 16-16 H1263.5 a16 16 0 0 1 16 16 V52 Z" class="raised"/>
<line x1="0" y1="52" x2="1280" y2="52" class="rule" stroke-width="1"/>
<g class="rulef"><circle cx="30" cy="26" r="6.5"/><circle cx="52" cy="26" r="6.5"/><circle cx="74" cy="26" r="6.5"/></g>
<text x="640.0" y="31" text-anchor="middle" class="sans muted" font-size="14">chitragit sync  —  ~/archive</text>
<g class="p0"><text x="48" y="112" class="mono" font-size="17"><tspan class="muted">~/archive</tspan><tspan class="accent"> ❯ </tspan></text></g>
<text x="171.0" y="112" class="mono text cmd" font-size="17">chitragit sync</text>
<rect x="170.0" y="94" width="167.5" height="26" class="surface ty"/>
<text x="48" y="142" class="mono l0" font-size="17" xml:space="preserve"><tspan class="sage">✓ </tspan><tspan class="text">Found 1284 repos (3 new, 1 moved, 0 missing)</tspan></text>
<text x="48" y="172" class="mono l1" font-size="17" xml:space="preserve"><tspan class="sage">✓ </tspan><tspan class="textb">torvalds/linux</tspan><tspan class="muted">  412 new commits, 2 new tags</tspan></text>
<text x="48" y="202" class="mono l2" font-size="17" xml:space="preserve"><tspan class="sage">✓ </tspan><tspan class="textb">golang/go</tspan><tspan class="muted">  37 new commits</tspan></text>
<text x="48" y="232" class="mono l3" font-size="17" xml:space="preserve"><tspan class="sage">✓ </tspan><tspan class="textb">you/dotfiles</tspan><tspan class="text">  applied 4 new commits and kept your local changes</tspan></text>
<text x="48" y="262" class="mono l4" font-size="17" xml:space="preserve"><tspan class="sage">✓ </tspan><tspan class="textb">charmbracelet/bubbletea</tspan><tspan class="muted">  6 new commits, 1 new branch</tspan></text>
<text x="48" y="292" class="mono l5" font-size="17" xml:space="preserve"><tspan class="muted">  ⋮</tspan></text>
<text x="48" y="322" class="mono l6" font-size="17" xml:space="preserve"><tspan class="amber">! </tspan><tspan class="textb">old/fork</tspan><tspan class="text">  upstream rewrote its history (force-push) and this branch has local work; it was left as it was</tspan></text>
