<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-label="Roadmap: all nine milestones, M0 Foundation to M8 Ship, are done in v1.0.">
<style>
@font-face{font-family:'Inter Display';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.bg{fill:#F6F8FA} .surface{fill:#EEF1F5} .raised{fill:#E4E8EE}
.rule{stroke:#D0D7DE} .rulef{fill:#D0D7DE}
.text{fill:#0D1117} .muted{fill:#57606A} .accent{fill:#1D4ED8} .accents{stroke:#1D4ED8}
.sky{fill:#0E6A8C} .sage{fill:#1A7F37} .amber{fill:#9A6700} .sindoor{fill:#CF222E}
.display{font-family:'Inter Display',Inter,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600} .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
