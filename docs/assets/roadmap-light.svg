<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-label="Roadmap to v1.0.0: Foundation (done): sync, TUI, providers, audit; Time machine (phase 1 · rc.1 · 20 nov): ledger, snapshots, restore; Rewind (phase 2 · rc.2 · 4 dec): undo, verify, code tab, diffs; Reach (phase 3 · rc.3 · 18 dec): search, issues offline, more forges; Mirror (v1.0.0 · 8 jan): chitragit serve, NAS mirror. Time machine is in progress.">
<style>
@font-face{font-family:'M PLUS Code Latin';font-weight:100 700;src:url(data:font/woff2;base64,) format('woff2')}

.bg{fill:#F6F8FA} .surface{fill:#EEF1F5} .raised{fill:#E4E8EE}
.rule{stroke:#D0D7DE} .rulef{fill:#D0D7DE}
.text{fill:#0D1117} .muted{fill:#57606A} .accent{fill:#1D4ED8} .accents{stroke:#1D4ED8}
.sky{fill:#0E6A8C} .sage{fill:#1A7F37} .amber{fill:#9A6700} .sindoor{fill:#CF222E}
.display{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace;font-weight:600} .sans{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace} .mono{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.6);opacity:0}}@media (prefers-reduced-motion: reduce){.pulse{animation:none;opacity:0}}
</style>
