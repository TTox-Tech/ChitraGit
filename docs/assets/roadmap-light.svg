ted" font-size="20">Reach</text><text x="890.0" y="170" text-anchor="middle" class="sans muted" font-size="13">search, issues offline, more forges</text><circle cx="1140.0" cy="104" r="8" class="bg rule" stroke-width="2"/><text x="1140.0" y="74" text-anchor="middle" class="mono muted" font-size="12" letter-spacing="1.5">v1.0.0 · 8 JAN</text><text x="1140.0" y="146" text-anchor="middle" class="display muted" font-size="20">Mirror</text><text x="1140.0" y="170" text-anchor="middle" class="sans muted" font-size="13">chitragit serve, NAS mirror</text>
