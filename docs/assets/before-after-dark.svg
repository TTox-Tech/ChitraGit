<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Before: a shell loop of git pull stops on local changes, conflicts and deleted repos. After: chitragit sync updates 412 repos in parallel, keeps local changes, never merges diverged repos and keeps vanished repos safe.">
<style>
@font-face{font-family:'M PLUS Code Latin';font-weight:100 700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.bg{fill:#0A0C10} .surface{fill:#111418} .raised{fill:#1A1F26}
.rule{stroke:#2B313A} .rulef{fill:#2B313A}
.text{fill:#E6EDF3} .muted{fill:#8B949E} .accent{fill:#3B82F6} .accents{stroke:#3B82F6}
.sky{fill:#7DD3FC} .sage{fill:#72C795} .amber{fill:#E3B341} .sindoor{fill:#F47067}
.display{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace;font-weight:600} .sans{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace} .mono{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace}

</style>
<rect x=".5" y=".5" width="1279" height="379" rx="18" class="bg rule" stroke-width="1"/>
<text x="32" y="42" class="sans muted" font-size="13" letter-spacing="3">BEFORE  ·  A SHELL LOOP</text>
<text x="1248" y="42" text-anchor="end" class="sans accent" font-size="13" letter-spacing="3">AFTER  ·  ONE COMMAND</text>
<rect x="32" y="64" width="596" height="292" rx="14" class="surface"/><rect x="32" y="64" width="596" height="292" rx="14" fill="none" class="rule" stroke-width="1"/><line x1="32" y1="108" x2="628" y2="108" class="rule" stroke-width="1"/><circle cx="54" cy="86" r="5" class="rulef"/><circle cx="70" cy="86" r="5" class="rulef"/><circle cx="86" cy="86" r="5" class="rulef"/><text x="606" y="91" text-anchor="end" class="sans sindoor" font-size="13" letter-spacing="2.5">FRAGILE</text><text x="56" y="144" class="mono muted" font-size="15">$ for d in */; do (cd "$d" &amp;&amp; git pull); done</text><text x="56" y="175" class="mono text" font-size="15">Updating 3f2a91c..8be04d1</text><text x="56" y="206" class="mono sindoor" font-size="15">error: Your local changes would be overwritten by merge.</text><text x="56" y="237" class="mono sindoor" font-size="15">Aborting</text><text x="56" y="268" class="mono text" font-size="15">CONFLICT (content): Merge conflict in src/main.go</text><text x="56" y="299" class="mono sindoor" font-size="15">fatal: repository 'github.com/x/tool' not found</text><text x="56" y="330" class="mono muted" font-size="15">... 463 more repos, one at a time</text>
<rect x="652" y="64" width="596" height="292" rx="14" class="surface"/><rect x="652" y="64" width="596" height="292" rx="14" fill="none" class="accents" stroke-width="1.6"/><line x1="652" y1="108" x2="1248" y2="108" class="rule" stroke-width="1"/><circle cx="674" cy="86" r="5" class="rulef"/><circle cx="690" cy="86" r="5" class="rulef"/><circle cx="706" cy="86" r="5" class="rulef"/><text x="1226" y="91" text-anchor="end" class="sans sage" font-size="13" letter-spacing="2.5">SAFE</text><text x="676" y="144" class="mono accent" font-size="15">$ chitragit sync</text><text x="676" y="175" class="mono sage" font-size="15">✓ 412 repos updated in 3m 08s, 8 at a time</text><text x="676" y="206" class="mono sage" font-size="15">✓ your changes kept in 17 repos</text><text x="676" y="237" class="mono amber" font-size="15">! 2 diverged: new data downloaded, nothing merged</text><text x="676" y="268" class="mono sky" font-size="15">★ x/tool vanished upstream: kept safe</text><text x="676" y="299" class="mono muted" font-size="15">· 49 already up to date</text><text x="676" y="330" class="mono muted" font-size="15">0 commits lost  ·  log: .chitragit/logs/</text>
</svg>
