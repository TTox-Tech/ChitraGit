<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ChitraGit: the keeper of your Git archive">
<style>
@font-face{font-family:'M PLUS Code Latin';font-weight:100 700;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Inter';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}

.bg{fill:#0A0C10} .surface{fill:#111418} .raised{fill:#1A1F26}
.rule{stroke:#2B313A} .rulef{fill:#2B313A}
.text{fill:#E6EDF3} .muted{fill:#8B949E} .accent{fill:#3B82F6} .accents{stroke:#3B82F6}
.sky{fill:#7DD3FC} .sage{fill:#72C795} .amber{fill:#E3B341} .sindoor{fill:#F47067}
.display{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace;font-weight:600} .sans{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace} .mono{font-family:'M PLUS Code Latin',Inter,ui-monospace,Menlo,Consolas,monospace}

</style>
<defs><clipPath id="r"><rect width="1280" height="640" rx="0"/></clipPath></defs>
<g clip-path="url(#r)">
  <rect width="1280" height="640" class="bg"/>
  <line x1="0" y1="36" x2="1280" y2="36" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="72" x2="1280" y2="72" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="108" x2="1280" y2="108" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="144" x2="1280" y2="144" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="180" x2="1280" y2="180" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="216" x2="1280" y2="216" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="252" x2="1280" y2="252" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="288" x2="1280" y2="288" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="324" x2="1280" y2="324" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="360" x2="1280" y2="360" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="396" x2="1280" y2="396" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="432" x2="1280" y2="432" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="468" x2="1280" y2="468" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="504" x2="1280" y2="504" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="540" x2="1280" y2="540" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="576" x2="1280" y2="576" class="rule" stroke-width="1" opacity=".55"/><line x1="0" y1="612" x2="1280" y2="612" class="rule" stroke-width="1" opacity=".55"/>
  <line x1="80" y1="0" x2="80" y2="640" class="accents" stroke-width="1.5" opacity=".9"/>
  <line x1="86" y1="0" x2="86" y2="640" class="accents" stroke-width="1" opacity=".45"/>
  <rect x="744" y="170" width="500" height="220" rx="12" class="surface" opacity=".92"/>
  <rect x="744" y="170" width="500" height="220" rx="12" fill="none" class="rule" stroke-width="1"/>
  <text x="780" y="214" class="mono sage" font-size="17">✓</text><text x="806" y="214" class="mono text" font-size="16">torvalds/linux</text><text x="780" y="250" class="mono muted" font-size="17">·</text><text x="806" y="250" class="mono text" font-size="16">golang/go</text><text x="780" y="286" class="mono sage" font-size="17">✓</text><text x="806" y="286" class="mono text" font-size="16">charmbracelet/bubbletea</text><text x="780" y="322" class="mono sage" font-size="17">✓</text><text x="806" y="322" class="mono text" font-size="16">you/dotfiles</text><text x="780" y="358" class="mono sky" font-size="17">★</text><text x="806" y="358" class="mono text" font-size="16">someone/vanished-tool</text>
  <text x="1216" y="214" text-anchor="end" class="sans muted" font-size="14">412 new commits</text><text x="1216" y="250" text-anchor="end" class="sans muted" font-size="14">up to date</text><text x="1216" y="286" text-anchor="end" class="sans muted" font-size="14">1 new branch</text><text x="1216" y="322" text-anchor="end" class="sans muted" font-size="14">updated, your changes kept</text><text x="1216" y="358" text-anchor="end" class="sans muted" font-size="14">kept safe</text>
</g>
<g transform="translate(120 90) scale(1.125)">
  <rect x="1" y="1" width="62" height="62" rx="15" fill="#111418" stroke="#2B313A" stroke-width="1.5"/>
  <g stroke="#E6EDF3" stroke-opacity=".32" stroke-width="2.4" stroke-linecap="round">
    <line x1="40" y1="19" x2="51" y2="19"/><line x1="40" y1="28" x2="51" y2="28"/>
    <line x1="40" y1="37" x2="51" y2="37"/><line x1="40" y1="46" x2="51" y2="46"/>
  </g>
  <g fill="none" stroke="#3B82F6" stroke-width="2.6" stroke-linecap="round">
    <line x1="20" y1="12" x2="20" y2="52"/>
    <path d="M20 19 C20 27 31 25 31 32 C31 39 20 37 20 46"/>
  </g>
  <circle cx="20" cy="19" r="4.2" fill="#3B82F6"/>
  <circle cx="31" cy="32" r="3.8" fill="#111418" stroke="#3B82F6" stroke-width="2.4"/>
  <circle cx="20" cy="46" r="4.2" fill="#3B82F6"/>
</g>
<text x="120" y="262" class="display text" font-size="92" letter-spacing="-1">Chitra<tspan class="accent">Git</tspan></text>
<text x="122" y="310" class="sans muted" font-size="30" >The keeper of your Git archive.</text>


  <g class="sans" font-size="20">
    <text x="120" y="390" class="muted">Sync, browse and protect thousands of local repos</text>
    <text x="120" y="420" class="muted">from one elegant, clickable terminal UI.</text>
  </g>
  <text x="120" y="584" class="sans muted" font-size="16" letter-spacing="2">GITHUB.COM/TTOX-TECH/CHITRAGIT</text>
<rect x=".5" y=".5" width="1279" height="639" rx="0" fill="none" class="rule" stroke-width="1"/>
</svg>
