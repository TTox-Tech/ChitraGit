# gitleaks config for this repo's own CI scan (.github/workflows/security.yml).
#
# Allowlist as little as possible, so that a real secret is still caught anywhere
# else, test files included:
# - secret_rules.toml holds KodeKavach's detection patterns, not secrets, and some
#   patterns look like keys to the scanner. That one file is skipped.
# - Fake tokens in tests are split ("ghp_" + "...") so they never match.
# - The two fake tokens committed whole before that change are listed one by one,
#   by commit fingerprint, in .gitleaksignore.
[extend]
useDefault = true

[[allowlists]]
description = "KodeKavach detection patterns"
paths = ['''^internal/audit/secret_rules\.toml$''']
