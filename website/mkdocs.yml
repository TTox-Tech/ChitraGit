# Docs site for chitragit, published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally:
#   pip install -r website/requirements.txt
#   cp -r docs/assets website/docs/assets && mkdocs serve -f website/mkdocs.yml
site_name: ChitraGit
site_description: The keeper of your Git archive. Keeps every repo synced, safe and accounted for.
site_url: https://ttox-tech.github.io/ChitraGit/
repo_url: https://github.com/TTox-Tech/ChitraGit
repo_name: TTox-Tech/ChitraGit
edit_uri: blob/main/website/docs/
copyright: MIT licensed · TTox.Tech

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

extra_css:
  - ledger.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Quick start: quick-start.md
  - Guide:
      - How sync keeps your work safe: guide/safety.md
      - The interactive ledger: guide/ledger.md
      - Forges, logins and Rescued repos: guide/providers.md
      - Conflicts: guide/conflicts.md
      - Scheduled sync: guide/scheduling.md
      - 'KodeKavach: security audit': guide/kodekavach.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Commands: reference/commands.md
      - Settings: reference/settings.md
