# Builds release archives and checksums. The Scoop manifest (bucket/chitragit.json) is
# updated by the scoop job in .github/workflows/release.yml.
# Run by .github/workflows/release.yml when a v* tag is pushed.
# Try it locally: goreleaser release --snapshot --clean
version: 2

project_name: chitragit

before:
  hooks:
    - go mod download

builds:
  - id: chitragit
    main: ./cmd/chitragit
    binary: chitragit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/TTox-Tech/chitragit/internal/version.Version={{ .Version }}
      - -X github.com/TTox-Tech/chitragit/internal/version.Commit={{ .FullCommit }}
      - -X github.com/TTox-Tech/chitragit/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"

release:
  github:
    owner: TTox-Tech
    name: ChitraGit
  prerelease: auto
  name_template: "ChitraGit v{{ .Version }}"
