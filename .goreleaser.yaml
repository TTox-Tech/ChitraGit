# Builds release archives and checksums. The Scoop manifest (bucket/chitragit.json) is
# updated by the scoop job in .github/workflows/release.yml.
# Run by .github/workflows/release.yml when a v* tag is pushed.
# Try it locally: goreleaser release --snapshot --clean
version: 2

project_name: chitragit

before:
  hooks:
    - go mod download

builds:
  - id: chitragit
    main: ./cmd/chitragit
    binary: chitragit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/TTox-Tech/chitragit/internal/version.Version={{ .Version }}
      - -X github.com/TTox-Tech/chitragit/internal/version.Commit={{ .FullCommit }}
      - -X github.com/TTox-Tech/chitragit/internal/version.Date={{ .CommitDate }}
      # OAuth App for `auth login github` (the repository variable CHITRAGIT_GITHUB_CLIENT_ID).
      # Without it, login asks for a personal access token instead.
      - -X github.com/TTox-Tech/chitragit/internal/auth.GitHubClientID={{ envOrDefault "CHITRAGIT_GITHUB_CLIENT_ID" "" }}
      # Public key that verifies downloaded KodeKavach rules packs (repository variable
      # KODEKAVACH_RULES_PUBLIC_KEY). Without it, `audit rules update` is turned off.
      - -X github.com/TTox-Tech/chitragit/internal/audit.RulesPublicKey={{ envOrDefault "KODEKAVACH_RULES_PUBLIC_KEY" "" }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive (chitragit_<version>_<os>_<arch>.<ext>.sbom.json), made by
# syft from the files inside it and listed in checksums.txt. Needs syft on PATH.
sboms:
  - artifacts: archive

git:
  # The rolling rules-pack release (.github/workflows/rules-pack.yml) is not a version.
  ignore_tags:
    - kodekavach-rules

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"

release:
  github:
    owner: TTox-Tech
    name: ChitraGit
  prerelease: auto
  name_template: "ChitraGit v{{ .Version }}"
