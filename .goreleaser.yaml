# Builds release archives, checksums, the Scoop manifest and the Homebrew cask.
# Run by .github/workflows/release.yml when a v* tag is pushed.
# Try it locally: goreleaser release --snapshot --clean
version: 2

project_name: chitragit

before:
  hooks:
    - go mod download

builds:
  - id: chitragit
    main: ./cmd/chitragit
    binary: chitragit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/TTox-Tech/chitragit/internal/version.Version={{ .Version }}
      - -X github.com/TTox-Tech/chitragit/internal/version.Commit={{ .FullCommit }}
      - -X github.com/TTox-Tech/chitragit/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"

release:
  github:
    owner: TTox-Tech
    name: ChitraGit
  prerelease: auto
  name_template: "ChitraGit v{{ .Version }}"

# Package managers. Both need the TAP_GITHUB_TOKEN secret: a fine-grained token with
# "Contents: read and write" on TTox-Tech/scoop-bucket and TTox-Tech/homebrew-tap.
# Pre-releases (v0.3.0-rc.1) are never pushed to them.
scoops:
  - name: chitragit
    repository:
      owner: TTox-Tech
      name: scoop-bucket
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/TTox-Tech/ChitraGit
    description: The keeper of your Git archive. Keeps every repo synced, safe and accounted for.
    license: MIT
    skip_upload: auto
    commit_author:
      name: TTox.Tech release bot
      email: 41898282+github-actions[bot]@users.noreply.github.com

homebrew_casks:
  - name: chitragit
    repository:
      owner: TTox-Tech
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    homepage: https://github.com/TTox-Tech/ChitraGit
    description: The keeper of your Git archive. Keeps every repo synced, safe and accounted for.
    license: MIT
    skip_upload: auto
    commit_author:
      name: TTox.Tech release bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    generate_completions_from_executable:
      args: [completion]
