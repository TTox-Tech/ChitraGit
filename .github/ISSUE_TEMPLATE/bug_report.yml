name: Bug report
description: Something went wrong or did not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If ChitraGit changed or lost anything in a repo, say so first:
        that is the most serious kind of bug and we look at it before anything else.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. chitragit init
        2. chitragit sync
        3. ...
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Was any local work or history lost?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `chitragit doctor` and `chitragit version`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (run the command again with `--verbose`)
      render: text
