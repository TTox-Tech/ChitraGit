name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/TTox-Tech/ChitraGit#roadmap) and
        [docs/PRD.md](https://github.com/TTox-Tech/ChitraGit/blob/main/docs/PRD.md) first:
        your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe your archive and what is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ChitraGit to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
