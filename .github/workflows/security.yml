name: Security

# Four scanners, one job each so they run side by side:
#   gitleaks     secrets in the whole git history
#   osv-scanner  known vulnerabilities in go.mod and website/requirements.txt
#   zizmor       unsafe patterns in these workflow files
#   semgrep      the Go rules from semgrep/semgrep-rules, pinned to one commit
#
# A finding fails the job. Fix it if it is real. If it is a false positive, silence just
# that one place and say why next to it:
#   gitleaks:    a "gitleaks:allow" comment on the line, or an entry in .gitleaksignore
#   osv-scanner: an [[IgnoredVulns]] entry with a reason in osv-scanner.toml
#   zizmor:      a "# zizmor: ignore[<audit>] <reason>" comment on the flagged line
#   semgrep:     a "// nosemgrep: <rule-id> -- <reason>" comment on the flagged line
# None of this runs on release tags, so a new advisory can never block a release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # every Monday, to catch advisories published since the last change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the git history
        run: gitleaks git --redact --verbose --exit-code 1 .

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Scan dependencies
        run: osv-scanner scan source --recursive .

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }} # read-only; lets zizmor check the pinned actions online
        run: pipx run zizmor==1.32.0 --format=github .github/workflows

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check out the Semgrep rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .semgrep-rules
          persist-credentials: false
      # incorrect-default-permission is off: it asks for 0600 on directories made with
      # MkdirAll, which would make them unusable. Our private dirs are already 0700.
      - name: Scan the Go code
        run: |
          pipx run semgrep==1.184.0 scan --config .semgrep-rules/go --metrics=off --error \
            --exclude-rule semgrep-rules.go.lang.correctness.permissions.incorrect-default-permission
