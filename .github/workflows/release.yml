name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload the archives
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release build never restores a cache another workflow wrote
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Test
        run: go test ./...
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            # A pre-release (1.0.0-rc.1) uses the notes of the version it leads up to.
            for v in "$version" "${version%%-*}"; do
              awk -v v="$v" '
                index($0, "## [" v "]") == 1 { found = 1; next }
                found && /^## \[/ { exit }
                found && /^\[[^]]+\]: http/ { next }
                found { print }
              ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
              [ -s "$RUNNER_TEMP/notes.md" ] && break
            done
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $version; using the generated changelog."
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHITRAGIT_GITHUB_CLIENT_ID: ${{ vars.CHITRAGIT_GITHUB_CLIENT_ID }}
          KODEKAVACH_RULES_PUBLIC_KEY: ${{ vars.KODEKAVACH_RULES_PUBLIC_KEY }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Keeps bucket/chitragit.json on main in step with the latest stable release.
  # Separate job so a failure here (for example branch protection) never blocks the release.
  scoop:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] the job pushes the manifest to main; no artifact is uploaded
          ref: main
      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          mkdir -p bucket
          scripts/update-scoop-manifest.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > bucket/chitragit.json.new
          mv bucket/chitragit.json.new bucket/chitragit.json
      - name: Commit manifest
        run: |
          git config user.name "TTox.Tech release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/chitragit.json
          git diff --cached --quiet && exit 0
          git commit -m "scoop: chitragit ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  # Installs the published release with the install scripts on all three OSes and runs
  # the end-to-end smoke test (sync keeps local work) against the installed binary.
  smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cosign
        if: runner.os == 'Linux'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the signature and provenance, as the docs tell users to
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: scripts/verify-release.sh "$TAG" "$RUNNER_TEMP/verify"
      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          CHITRAGIT_VERSION: ${{ github.ref_name }}
          CHITRAGIT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHITRAGIT_VERSION: ${{ github.ref_name }}
          CHITRAGIT_INSTALL_DIR: ${{ runner.temp }}\bin
        run: ./install.ps1
      - name: Smoke test
        shell: bash
        run: scripts/smoke-test.sh "$RUNNER_TEMP/bin/chitragit$( [ "$RUNNER_OS" = Windows ] && echo .exe )" "${GITHUB_REF_NAME}"

  # Builds the Winget manifests and attaches them to the release. With the WINGET_TOKEN
  # secret (a classic token with public_repo) it also opens the PR on microsoft/winget-pkgs.
  winget:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          dir="$(scripts/winget-manifests.sh "$TAG" "$RUNNER_TEMP/checksums.txt" "$RUNNER_TEMP/winget")"
          echo "WINGET_DIR=$dir" >> "$GITHUB_ENV"
          (cd "$dir" && 7z a "$RUNNER_TEMP/winget-manifests.zip" ./*.yaml)
          gh release upload "$TAG" "$RUNNER_TEMP/winget-manifests.zip" --clobber
      - name: Validate manifests
        shell: pwsh
        run: winget validate --manifest "$env:WINGET_DIR"
        continue-on-error: true
      - name: Submit to winget-pkgs
        if: ${{ env.WINGET_TOKEN != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: TTox-Tech.ChitraGit $($env:GITHUB_REF_NAME.TrimStart('v'))" "$env:WINGET_DIR"
