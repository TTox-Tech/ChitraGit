name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Test
        run: go test ./...
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "args=--release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md section for $version; using the generated changelog."
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Keeps bucket/chitragit.json on main in step with the latest stable release.
  # Separate job so a failure here (for example branch protection) never blocks the release.
  scoop:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Update Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          scripts/update-scoop-manifest.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > bucket/chitragit.json.new
          mv bucket/chitragit.json.new bucket/chitragit.json
      - name: Commit manifest
        run: |
          git config user.name "TTox.Tech release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/chitragit.json
          git diff --cached --quiet && exit 0
          git commit -m "scoop: chitragit ${GITHUB_REF_NAME}"
          git push origin HEAD:main
