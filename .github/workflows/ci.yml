name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # e.g. after the Demo GIFs workflow pushed to a pull request branch

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Vet
        run: go vet ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test ./...
      - name: Test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...

  cross-build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null ./cmd/chitragit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # builds the same archives as a release, so no shared cache
      - name: Build every release archive (snapshot, nothing is published)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Check the Linux archive runs
        run: |
          tar -xzf dist/chitragit_*_linux_amd64.tar.gz -C "$RUNNER_TEMP" chitragit
          "$RUNNER_TEMP/chitragit" version
      - name: Check the package manifest scripts
        run: |
          printf 'aa  chitragit_9.9.9_windows_amd64.zip\nbb  chitragit_9.9.9_windows_arm64.zip\n' > "$RUNNER_TEMP/sums.txt"
          scripts/update-scoop-manifest.sh v9.9.9 "$RUNNER_TEMP/sums.txt" | jq -e '.version == "9.9.9"'
          scripts/winget-manifests.sh v9.9.9 "$RUNNER_TEMP/sums.txt" "$RUNNER_TEMP/winget"

  # End-to-end: a real binary syncs a small archive with local remotes and keeps local work.
  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: go build -o "$RUNNER_TEMP/chitragit$( [ "$RUNNER_OS" = Windows ] && echo .exe )" ./cmd/chitragit
      - name: Smoke test
        shell: bash
        run: scripts/smoke-test.sh "$RUNNER_TEMP/chitragit$( [ "$RUNNER_OS" = Windows ] && echo .exe )"
