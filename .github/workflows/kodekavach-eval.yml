# Scores KodeKavach on its eval corpus (internal/audit/testdata/eval) whenever the
# checks, the rules pack or the corpus change, and fails below 0.95 precision or
# 0.90 recall. The scores appear in the job summary.
name: KodeKavach eval

on:
  push:
    branches: [main]
    paths: ["internal/audit/**", ".github/workflows/kodekavach-eval.yml"]
  pull_request:
    paths: ["internal/audit/**", ".github/workflows/kodekavach-eval.yml"]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Precision and recall gate
        run: go test -count=1 -v -run 'TestEval' ./internal/audit/
