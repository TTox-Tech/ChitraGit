# The performance budget (PRD §11), measured on a synthetic archive
# (internal/perf).
#
# - Pull requests: the benchmarks run on the base commit and on the PR, on
#   the same runner, five times each. The PR fails when a median is more
#   than 15% (and more than 50 ms) slower than on the base.
# - Pushes to main: 5,000 repos; nightly: 20,000. Timings only.
#
# The timings appear in the job summary.
name: Perf budget

on:
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", ".github/workflows/perf.yml"]
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", ".github/workflows/perf.yml"]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: Repos in the synthetic archive
        default: "5000"

permissions:
  contents: read

env:
  BENCH: go test ./internal/perf -run=^$ -bench=. -benchtime=3s -count=5 -timeout=50m

jobs:
  bench:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHITRAGIT_PERF_REPOS: ${{ inputs.repos || (github.event_name == 'schedule' && '20000') || '5000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Benchmark ${{ env.CHITRAGIT_PERF_REPOS }} repos
        run: $BENCH | tee bench.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### Perf budget, $CHITRAGIT_PERF_REPOS repos"
            echo
            go run ./internal/perf/benchreport bench.txt
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHITRAGIT_PERF_REPOS: "5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: head/go.mod
          cache-dependency-path: head/go.sum
      - name: Benchmark the base commit
        working-directory: base
        run: |
          if [ ! -d internal/perf ]; then
            echo "The base commit has no perf benchmarks yet; nothing to compare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          $BENCH | tee ../base.txt
      - name: Benchmark this pull request
        working-directory: head
        run: $BENCH | tee ../head.txt
      - name: Compare (fails on a slowdown over 15%)
        working-directory: head
        run: |
          {
            echo "### Perf budget, $CHITRAGIT_PERF_REPOS repos"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s ../base.txt ]; then
            go run ./internal/perf/benchreport ../head.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          go run ./internal/perf/benchreport -base ../base.txt -max 15 -floor 50ms ../head.txt > ../compare.md || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < ../compare.md
          exit $status
